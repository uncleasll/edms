services:
  - type: web
    name: edms-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements-postgres.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_DIR
        value: storage
